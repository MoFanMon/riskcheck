[build-system]
requires = ["setuptools>=77.0.3,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "riskcheck-offline"
dynamic = ["version"]
description = "Offline advisory checks with evidence-aware CI gates"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MoFanMon"}]
keywords = ["security", "offline", "vulnerability", "ci", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
riskcheck = "riskcheck:main"

[project.urls]
Homepage = "https://github.com/MoFanMon/riskcheck"
Documentation = "https://github.com/MoFanMon/riskcheck/tree/main/docs"
Issues = "https://github.com/MoFanMon/riskcheck/issues"
Changelog = "https://github.com/MoFanMon/riskcheck/blob/main/CHANGELOG.md"
Download = "https://github.com/MoFanMon/riskcheck/releases"

[tool.setuptools]
py-modules = ["riskcheck"]
packages = ["riskcheck_data"]

[tool.setuptools.dynamic]
version = {attr = "riskcheck.__version__"}

[tool.setuptools.package-data]
riskcheck_data = ["rules.json"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["E402"]
