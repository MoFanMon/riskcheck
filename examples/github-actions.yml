name: Project risk gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  riskcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: target
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MoFanMon/riskcheck
          ref: v0.1.0
          path: riskcheck-tool
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: >-
          python -I -S riskcheck-tool/riskcheck.py --root target
          --inventory target/ci/assets.json --require node
          --format json --output risk-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: risk-report
          path: risk-report.json
